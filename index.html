<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>后室 BACKROOMS</title><meta name="color-scheme" content="dark"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#d9cf8a;font-family:"Noto Serif SC","Songti SC",serif;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%}
#fx,#hit{position:fixed;inset:0;pointer-events:none;opacity:0}
#fx{background:radial-gradient(transparent 40%,#000a 100%);mix-blend-mode:multiply}
#hit{background:radial-gradient(transparent 30%,#a00 120%);transition:opacity .4s}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b0a05ee;z-index:10;padding:20px;text-align:center}
.ov[hidden],#hud[hidden],#touch[hidden],#help[hidden]{display:none}
h1{font-size:clamp(48px,14vw,110px);margin:0;letter-spacing:.3em;font-weight:900;color:#c9b44a;text-shadow:3px 0 #7a1010,-3px 0 #104a7a}
.sub{max-width:34em;opacity:.7;margin:0 0 12px}
button{font:inherit;color:#d9cf8a;background:#1b1807;border:1px solid #6b5f24;padding:12px 26px;min-width:220px;font-size:18px}
button:active{background:#3a3210}
#help{max-width:36em;font-size:14px;line-height:1.7;display:flex;flex-direction:column;gap:8px}
#help p{margin:0;text-align:left}
#hud{position:fixed;inset:0;pointer-events:none;font-size:13px;text-shadow:0 0 4px #000}
#bars{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:3px;width:130px}
#bars i{font-style:normal;display:flex;align-items:center;gap:6px;justify-content:space-between}
#bars b{display:block;width:80px;height:6px;background:#2228;position:relative}
#bars b:after{content:"";position:absolute;inset:0;width:var(--v,100%);background:var(--c,#c9b44a)}
#info{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));text-align:right;max-width:46vw}
#prompt{position:absolute;left:0;right:0;top:58%;text-align:center;font-size:16px}
#toast{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:18px;opacity:0;transition:opacity .5s}
#quick{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.8;white-space:nowrap}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
#chase{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 35%,#900 130%);transition:opacity .3s}
#mm{display:block;margin:6px 0 0 auto;width:min(110px,24vh);height:min(110px,24vh);background:#0009;border:1px solid #6b5f24}
#arrow{display:none;color:#6c6;font-size:18px;font-weight:900;text-shadow:0 0 6px #4c4}
#joy{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;border:2px solid #c9b44a66;background:#0004;pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#c9b44a77}
#btns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,54px);gap:8px;pointer-events:none}
#btns button{pointer-events:auto;min-width:0;width:54px;height:54px;padding:0;border-radius:50%;opacity:.55;font-size:16px}
#inv{align-items:stretch;max-width:420px;margin:auto;font-size:15px}
#inv{width:min(92vw,480px);max-height:86vh;overflow:auto;background:#0b0a05f2;border:1px solid #76672a}
#inv h2{margin:0 0 4px;color:#d9c45a;font-size:28px}
#inv .invhint{font-size:12px;opacity:.65;margin:0 0 8px}
#invl{display:flex;flex-direction:column;gap:7px;width:100%;max-height:48vh;overflow:auto}
.invrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px;background:#211e10;border:1px solid #554a20;text-align:left}
.invrow strong{display:block;color:#e6d68c}
.invrow small{display:block;opacity:.65;font-size:11px;margin-top:3px}
.invrow .count{font-size:14px;white-space:nowrap}
.invrow button{min-width:64px;padding:7px 10px;font-size:13px}
.invrow button:disabled{opacity:.25}
#inv .invactions{display:flex;gap:8px;width:100%;margin-top:5px}
#inv .invactions button{flex:1;min-width:0}

 else if(lid===null&&t.clientX>innerWidth/2&&!t.target.closest('#btns')){lid=t.identifier;lx=t.clientX;ly=t.clientY}}},{passive:false});
function jm(t){const r=joy.getBoundingClientRect(),cx=r.left+65,cy=r.top+65;let dx=t.clientX-cx,dy=t.clientY-cy;const d=Math.hypot(dx,dy),m=50;if(d>m){dx*=m/d;dy*=m/d}
 kn.style.transform=`translate(${dx}px,${dy}px)`;TC.mx=dx/m;TC.mz=-dy/m;TC.sprint=Math.hypot(dx,dy)>m*.95}
addEventListener('touchmove',e=>{if(state==='play')e.preventDefault();for(const t of e.changedTouches){
 if(t.identifier===jid)jm(t);else if(t.identifier===lid){const s=set.sens*.0009;P.yaw-=(t.clientX-lx)*s;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-(t.clientY-ly)*s));lx=t.clientX;ly=t.clientY}}},{passive:false});
const te=e=>{for(const t of e.changedTouches){if(t.identifier===jid){jid=null;TC.mx=TC.mz=0;TC.sprint=false;kn.style.transform=''}if(t.identifier===lid)lid=null}};
addEventListener('touchend',te);addEventListener('touchcancel',te);
document.querySelectorAll('#btns button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play'&&k!=='pause')return;
  if(k==='jump')K.Space=true;if(k==='crouch')TC.crouch=!TC.crouch;if(k==='sprint')TC.sprint=!TC.sprint;if(k==='use')interact();if(k==='flash')P.light=!P.light;
  if(k==='inv'){openInventory()}if(k==='map')toggleMap();if(k==='pause')pause()});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(k==='jump')K.Space=false}))});
$('c').addEventListener('click',()=>{if(state==='play'&&!isTouch&&!document.pointerLockElement){try{$('c').requestPointerLock()}catch(e){}}});
// 菜单
$('bNew').onclick=()=>{try{start(true)}catch(err){showBootError(err)}};$('bCont').onclick=()=>{try{start(false)}catch(err){showBootError(err)}};$('bHelp').onclick=()=>$('help').hidden=!$('help').hidden;
$('bRes').onclick=resume;$('bSave').onclick=save;$('bInvX').onclick=resume;$('bInvSave').onclick=()=>{save();renderInv()};
$('bMenu').onclick=$('bMenu2').onclick=()=>{state='menu';$('hud').hidden=true;$('touch').hidden=true;['pause','dead'].forEach(i=>$(i).hidden=true);$('menu').hidden=false;$('bCont').disabled=!Save.get();$('bCont').style.opacity=Save.get()?1:.4};
$('bRetry').onclick=()=>{const s=Save.get();$('dead').hidden=true;if(s){start(false);P.hp=Math.max(P.hp,70);P.hun=Math.max(P.hun,35);P.thi=Math.max(P.thi,35);P.san=Math.max(P.san,40);P.bat=Math.max(P.bat,30)}else start(true)};
const ss=()=>{set.sens=+$('sens').value;set.vol=+$('vol').value;set.diff=+$('dif').value;diff=set.diff;Sfx.setVol(set.vol/10);try{localStorage.setItem('br_set',JSON.stringify(set))}catch(e){}};
$('sens').oninput=$('vol').oninput=$('dif').oninput=$('dif').onchange=ss;$('qual').onchange=resize;
if(init()){renderInv();requestAnimationFrame(loop)}
}
loadThree().then(boot).catch(showBootError);
})();
</script></body></html>
